name: CI and Release

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  NPM_CONFIG_AUDIT: false
  NPM_CONFIG_FUND: false
  NPM_CONFIG_PREFER_OFFLINE: true
  GH_TOKEN: ${{ github.token }}

jobs:
  test-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version needs a release
        id: release-check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          $exists = $releases.tagName -contains $tag
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "required=$(-not $exists)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Cache Tauri NSIS toolchain
        if: steps.release-check.outputs.required == 'true'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: tauri-nsis-windows-v1

      - name: Install frontend tools
        run: npm ci --ignore-scripts

      - name: Type-check and build frontend
        run: npm run build

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Package Tauri installer
        if: steps.release-check.outputs.required == 'true'
        run: npm run dist

      - name: Create GitHub release
        if: steps.release-check.outputs.required == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release-check.outputs.version }}'
          $tag = '${{ steps.release-check.outputs.tag }}'
          $built = "src-tauri/target/release/bundle/nsis/Willow Discord Bridge_${version}_x64-setup.exe"
          $installer = "Willow-Discord-Bridge-${version}-Setup.exe"
          Copy-Item $built $installer
          gh release create $tag $installer `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Willow Discord Bridge $version" `
            --generate-notes
