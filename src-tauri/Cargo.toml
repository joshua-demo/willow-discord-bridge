[package]
name = "willow-discord-bridge"
version = "0.3.0"
description = "Tiny Windows tray bridge between Willow Voice and Discord"
authors = ["Willow Discord Bridge contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "willow_discord_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
